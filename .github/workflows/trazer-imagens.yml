name: Trazer imagens para o site

# Automação temporária: baixa as mídias do portfólio da pasta do Google Drive,
# salva em public/midia e atualiza os links no código. Pode ser apagada depois.

on:
  push:
    branches: [migracao-locaweb]
    paths: [".github/workflows/trazer-imagens.yml"]

permissions:
  contents: write

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Python
        run: python3 -m pip install --quiet pillow

      - name: Baixar do Google Drive e converter para WebP
        run: python3 scripts/trazer-do-drive.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/midia src scripts/relatorio-drive.txt
          git commit -m "Traz as mídias do portfólio do Google Drive para dentro do site (public/midia)" || echo "Nada novo para salvar"
          git push
