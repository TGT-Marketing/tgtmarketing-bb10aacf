# Mostra o registro dos formulários guardado no servidor (fora da public_html) e os logs de erro do PHP.
name: Ver registro dos formulários

on:
  workflow_dispatch:
  push:
    branches: [migracao-locaweb]
    paths:
      - .github/workflows/ver-registros.yml

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ler registros no servidor
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USUARIO: ${{ secrets.LOCAWEB_FTP_USUARIO }}
          LFTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_SENHA }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          lf() { lftp --env-password -u "$FTP_USUARIO" "sftp://$FTP_HOST" -e "set net:max-retries 2; set net:timeout 25; set sftp:auto-confirm yes; $1; bye" 2>&1; }
          {
            echo "REGISTRO DOS FORMULÁRIOS (horário de Brasília):"
          } > saida.txt
          mkdir -p reg && cd reg
          lf "get tgt-formularios.log" > /dev/null || true
          {
            if [ -f tgt-formularios.log ]; then tail -n 30 tgt-formularios.log; else echo "SEM tgt-formularios.log"; fi
          } >> ../saida.txt
          cd ..
          # As anotações do GitHub têm limite por passo: junta tudo em blocos
          tr '\n' '~' < saida.txt | sed 's/~/ ¦ /g' | fold -w 1500 | head -9 | while IFS= read -r l; do echo "::notice::$l"; done
          true
