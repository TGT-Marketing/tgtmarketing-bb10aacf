# Testa os formulários do site principal e do /marcas como um visitante real
# (abre o site num navegador, preenche e envia). Cada execução manda leads "TESTE TGT" para contato@.
name: Testar formulários (navegador real)

on:
  workflow_dispatch:
    inputs:
      testar:
        description: "Formulários a testar (principal, marcas, midias)"
        default: "principal,marcas,midias"

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar o navegador
        run: |
          mkdir -p /tmp/teste && cp scripts/testar-formularios.mjs /tmp/teste/
          cd /tmp/teste && npm init -y > /dev/null && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright@1.56.0 > /dev/null
          google-chrome --version || npx playwright install chromium

      - name: Preencher e enviar os formulários
        timeout-minutes: 6
        working-directory: /tmp/teste
        env:
          TESTAR: ${{ inputs.testar }}
          MIDIAS_PATH: /gestaodemidias/
        run: node testar-formularios.mjs

      - name: Guardar as telas do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-do-teste
          path: /tmp/teste/*.png
          retention-days: 7
