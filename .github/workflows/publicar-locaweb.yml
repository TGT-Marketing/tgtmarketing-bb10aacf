# Publica o site na hospedagem Locaweb (pasta public_html) a cada atualização do branch.
# Os dados de acesso ficam guardados como "secrets" do repositório (Settings > Secrets and variables > Actions):
#   LOCAWEB_FTP_HOST     host de FTP (use o host alternativo enquanto o domínio ainda apontar para o Lovable)
#   LOCAWEB_FTP_USUARIO  usuário de FTP
#   LOCAWEB_FTP_SENHA    senha de FTP
#   LOCAWEB_SMTP_SENHA   senha da caixa postal contato@tgtmarketing.com.br (envio dos formulários)
#   LOCAWEB_SMTP_USUARIO opcional: outra caixa postal do domínio para enviar (padrão: contato@tgtmarketing.com.br)
# O envio tenta SFTP (criptografado) e, se o plano não liberar, usa o FTP padrão da Locaweb.
name: Publicar na Locaweb

on:
  push:
    branches: [migracao-locaweb]
  workflow_dispatch:
    inputs:
      lead_teste:
        description: "Enviar 1 lead de teste por formulário (site, /sites e /marcas) para contato@tgtmarketing.com.br"
        type: boolean
        default: false

concurrency:
  group: publicar-locaweb
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir se os dados de acesso já foram cadastrados
        id: dados
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USUARIO: ${{ secrets.LOCAWEB_FTP_USUARIO }}
          FTP_SENHA: ${{ secrets.LOCAWEB_FTP_SENHA }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USUARIO" ] && [ -n "$FTP_SENHA" ]; then
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Dados de FTP da Locaweb ainda não cadastrados: o site foi gerado, mas não foi enviado."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Gerar o site
        run: npm run build

      - name: Enviar para a public_html da Locaweb
        if: steps.dados.outputs.pronto == 'sim'
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USUARIO: ${{ secrets.LOCAWEB_FTP_USUARIO }}
          LFTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_SENHA }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          rm -f dist/placeholder.svg
          enviar() {
            lftp --env-password -u "$FTP_USUARIO" "$1" -e "
              set net:max-retries 2; set net:timeout 25; set net:reconnect-interval-base 5;
              set sftp:auto-confirm yes; set ftp:ssl-allow no; set ftp:passive-mode yes;
              mirror --reverse --parallel=4 --exclude-glob .git* dist/ public_html/;
              cls -1 public_html/ ; bye"
          }
          # SFTP (criptografado) primeiro; se o plano não liberar, usa o FTP padrão da Locaweb
          if enviar "sftp://$FTP_HOST" > envio.log 2>&1; then
            echo "::notice::Site enviado por SFTP (conexão criptografada)."
          elif enviar "ftp://$FTP_HOST" > envio.log 2>&1; then
            echo "::notice::Site enviado por FTP (o plano não liberou SFTP)."
          else
            echo "::error::Não foi possível enviar o site. Últimas linhas do envio:"; tail -15 envio.log; exit 1
          fi

      - name: Configurar o envio de e-mail dos formulários (SMTP da Locaweb)
        if: steps.dados.outputs.pronto == 'sim'
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USUARIO: ${{ secrets.LOCAWEB_FTP_USUARIO }}
          LFTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_SENHA }}
          SMTP_USUARIO: ${{ secrets.LOCAWEB_SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.LOCAWEB_SMTP_SENHA }}
        run: |
          # A Locaweb desativa a função mail() do PHP: os formulários enviam pela caixa postal (SMTP autenticado).
          # A senha vem dos secrets e vai para um arquivo FORA da public_html (não fica no código nem no site).
          if [ -z "$SMTP_SENHA" ]; then
            echo "::warning::Falta cadastrar o secret LOCAWEB_SMTP_SENHA (senha do e-mail contato@tgtmarketing.com.br). Sem ele, os formulários não conseguem enviar e-mail."
            exit 0
          fi
          # Espaços ou quebra de linha colados junto com a senha no GitHub derrubam o login
          LIMPA=$(printf '%s' "$SMTP_SENHA" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\r\n')
          if [ "$LIMPA" != "$SMTP_SENHA" ]; then
            echo "::notice::A senha cadastrada tinha espaço ou quebra de linha no começo/fim: removidos."
            SMTP_SENHA="$LIMPA"
          fi
          U=$(printf '%s' "${SMTP_USUARIO:-contato@tgtmarketing.com.br}" | tr -d '[:space:]')
          umask 077
          mkdir -p .smtp
          {
            echo "<?php"
            echo "// Gerado automaticamente na publicação (GitHub Actions). Não publique este arquivo."
            echo "return array('host' => 'email-ssl.com.br', 'porta' => 465, 'usuario' => base64_decode('$(printf '%s' "$U" | base64 -w0)'), 'senha' => base64_decode('$(printf '%s' "$SMTP_SENHA" | base64 -w0)'));"
          } > .smtp/tgt-smtp-config.php
          for proto in sftp ftp; do
            if lftp --env-password -u "$FTP_USUARIO" "$proto://$FTP_HOST" -e "
                set net:max-retries 2; set net:timeout 25; set sftp:auto-confirm yes; set ftp:ssl-allow no; set ftp:passive-mode yes;
                put .smtp/tgt-smtp-config.php -o tgt-smtp-config.php; bye" > smtp.log 2>&1; then
              echo "::notice::Configuração do envio de e-mail gravada no servidor (fora da public_html), usando $U."
              break
            fi
            [ "$proto" = ftp ] && { echo "::error::Não consegui gravar a configuração do SMTP no servidor."; tail -5 smtp.log; }
          done
          rm -rf .smtp

      - name: Remover do servidor pastas que saíram do site
        if: steps.dados.outputs.pronto == 'sim'
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USUARIO: ${{ secrets.LOCAWEB_FTP_USUARIO }}
          LFTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_SENHA }}
        run: |
          # O envio só acrescenta e atualiza arquivos. Pastas listadas aqui são apagadas do servidor.
          REMOVER="marcas-previa"
          ARQUIVOS="diag-419d85af2d669db3.php"
          for arq in $ARQUIVOS; do
            for proto in sftp ftp; do
              if lftp --env-password -u "$FTP_USUARIO" "$proto://$FTP_HOST" -e "
                  set net:max-retries 2; set net:timeout 25; set sftp:auto-confirm yes; set ftp:ssl-allow no; set ftp:passive-mode yes;
                  rm -f public_html/$arq; bye" > remover.log 2>&1; then
                echo "::notice::Arquivo $arq removido do servidor (ou já não existia)."; break
              fi
            done
          done
          for pasta in $REMOVER; do
            if [ -d "dist/$pasta" ]; then echo "::warning::$pasta ainda existe no projeto, não foi apagada"; continue; fi
            for proto in sftp ftp; do
              if lftp --env-password -u "$FTP_USUARIO" "$proto://$FTP_HOST" -e "
                  set net:max-retries 2; set net:timeout 25; set sftp:auto-confirm yes; set ftp:ssl-allow no; set ftp:passive-mode yes;
                  rm -r -f public_html/$pasta; bye" > remover.log 2>&1; then
                echo "::notice::Pasta $pasta removida do servidor (ou já não existia)."; break
              fi
            done
          done

      - name: Conferir se o servidor da Locaweb já entrega o site novo
        if: steps.dados.outputs.pronto == 'sim'
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
        run: |
          IP=$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')
          echo "::notice::IP do servidor de hospedagem: $IP"
          for h in www.tgtmarketing.com.br; do
            T=$(curl -s -m 20 --resolve "$h:443:$IP" "https://$h/" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
            echo "::notice::Servidor $IP com $h responde: ${T:-sem título (vazio ou erro)}"
          done
          C=$(curl -s -o /dev/null -w '%{http_code}' -m 20 --resolve "www.tgtmarketing.com.br:443:$IP" "https://www.tgtmarketing.com.br/obrigado")
          echo "::notice::Página /obrigado no servidor novo: HTTP $C"
          if [ "$(curl -s -m 20 --resolve "www.tgtmarketing.com.br:443:$IP" "https://www.tgtmarketing.com.br/" | sha1sum | cut -c1-12)" = "$(sha1sum dist/index.html | cut -c1-12)" ]; then
            echo "::notice::Conferido: o index.html no servidor é idêntico ao desta versão."
          else
            echo "::warning::O index.html no servidor é diferente desta versão (pode ser cache da Locaweb)."
          fi

      - name: Conferir as landings /sites e /marcas no servidor
        if: steps.dados.outputs.pronto == 'sim'
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          SMTP_SENHA: ${{ secrets.LOCAWEB_SMTP_SENHA }}
        run: |
          IP=$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')
          H=www.tgtmarketing.com.br
          T=$(curl -s -m 20 --resolve "$H:443:$IP" "https://$H/sites/" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
          echo "::notice::/sites/ responde: ${T:-sem título}"
          C=$(curl -s -o /dev/null -w '%{http_code}' -L -m 20 --resolve "$H:443:$IP" "https://$H/sites/politica-de-privacidade")
          echo "::notice::/sites/politica-de-privacidade: HTTP $C"
          G=$(curl -s -m 20 --resolve "$H:443:$IP" "https://$H/sites/enviar-lead.php")
          echo "::notice::Formulário (GET, deve recusar): $G"
          P=$(curl -s -m 20 --resolve "$H:443:$IP" -X POST -H 'Content-Type: application/json' -d '{"website":"teste-automatico"}' "https://$H/sites/enviar-lead.php")
          echo "::notice::Formulário (teste sem enviar e-mail): $P"
          A=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -m 20 --resolve "$H:443:$IP" "https://$H/sites/assets/$(ls dist/sites/assets | grep -m1 '^main-.*\.js$')")
          echo "::notice::Arquivo JS da landing: $A"
          M=$(curl -s -m 20 --resolve "$H:443:$IP" "https://$H/marcas/" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
          echo "::notice::/marcas/ responde: ${M:-sem título}"
          MP=$(curl -s -m 20 --resolve "$H:443:$IP" -X POST -H 'Content-Type: application/json' -d '{"website":"teste-automatico"}' "https://$H/marcas/enviar-diagnostico.php")
          echo "::notice::Formulário do /marcas (teste sem enviar e-mail): $MP"
          # Login no SMTP pelos 3 formulários (não envia e-mail; o token do dia só funciona com a senha)
          if [ -n "$SMTP_SENHA" ]; then
            SMTP_SENHA=$(printf '%s' "$SMTP_SENHA" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\r\n')
            TOKEN=$(printf '%s' "$(date -u +%F)" | openssl dgst -sha256 -hmac "$SMTP_SENHA" -r | cut -d' ' -f1)
            # Para não acumular tentativas de login erradas (a Locaweb pode bloquear), para no primeiro erro
            for u in enviar-contato.php sites/enviar-lead.php marcas/enviar-diagnostico.php; do
              R=$(curl -s -m 60 --resolve "$H:443:$IP" -X POST -H "X-TGT-Verificar: $TOKEN" "https://$H/$u" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n\t' ' ' | cut -c1-220)
              echo "::notice::E-mail do formulário /$u: $R"
              case "$R" in *'"success":true'*) ;; *) break ;; esac
            done
          else
            echo "::warning::Formulários sem senha do e-mail cadastrada (secret LOCAWEB_SMTP_SENHA): os envios vão falhar até ela ser cadastrada."
          fi

      - name: Lead de teste nos 3 formulários (só quando pedido manualmente)
        if: steps.dados.outputs.pronto == 'sim' && github.event_name == 'workflow_dispatch' && inputs.lead_teste
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
        run: |
          IP=$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')
          H=www.tgtmarketing.com.br
          QUANDO=$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')
          enviar() {
            R=$(curl -s -m 60 --resolve "$H:443:$IP" -X POST -H 'Content-Type: application/json' -d "$2" "https://$H/$1" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n\t' ' ' | cut -c1-200)
            echo "::notice::Lead de teste em /$1: $R"
          }
          enviar enviar-contato.php '{"nome":"TESTE TGT site principal","empresa":"Teste do formulário","email":"contato@tgtmarketing.com.br","whatsapp":"(19) 99279-5271","faturamento":"Teste","objetivo":"Teste automático do envio em '"$QUANDO"' (pode apagar)"}'
          enviar sites/enviar-lead.php '{"tipo":"rapido","nome":"TESTE TGT landing sites","email":"contato@tgtmarketing.com.br","whatsapp":"(19) 99279-5271","mensagem":"Teste automático do envio em '"$QUANDO"' (pode apagar)"}'
          enviar marcas/enviar-diagnostico.php '{"nome":"TESTE TGT branding","email":"contato@tgtmarketing.com.br","whatsapp":"(19) 99279-5271","empresa":"Teste do formulário","segmento":"Teste","estagio":"Teste","objetivo":"Teste","orcamento":"Teste","desafio":"Teste automático do envio em '"$QUANDO"' (pode apagar)"}'

      - name: Mostrar para onde o domínio aponta hoje
        run: |
          echo "::notice::Google DNS: $(dig +short A www.tgtmarketing.com.br @8.8.8.8 | tr '\n' ' ') | Cloudflare DNS: $(dig +short A www.tgtmarketing.com.br @1.1.1.1 | tr '\n' ' ') | Locaweb NS: $(dig +short A tgtmarketing.com.br @ns1.locaweb.com.br | tr '\n' ' ')"
          echo "::notice::TTL e SOA: $(dig +noall +answer A tgtmarketing.com.br @ns1.locaweb.com.br | tr -s ' \t' ' ') | $(dig +short SOA tgtmarketing.com.br @ns1.locaweb.com.br)"
          IP=$(dig +short A tgtmarketing.com.br @ns1.locaweb.com.br | tail -1)
          for h in www.tgtmarketing.com.br tgtmarketing.com.br; do
            CERT=$(echo | timeout 15 openssl s_client -connect "$IP:443" -servername "$h" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null | tr '\n' ' ')
            OK=$(curl -s -o /dev/null -w '%{http_code}' -m 20 --resolve "$h:443:$IP" "https://$h/" || echo "falhou")
            echo "::notice::HTTPS em $IP para $h: status $OK | certificado: ${CERT:-nenhum}"
          done
          for u in http://www.tgtmarketing.com.br/ http://tgtmarketing.com.br/obrigado https://tgtmarketing.com.br/ https://www.tgtmarketing.com.br/ https://www.tgtmarketing.com.br/obrigado; do
            echo "::notice::$u responde: $(curl -s -o /dev/null -m 20 -w '%{http_code} -> %{redirect_url}' "$u") | seguindo redirecionamentos: $(curl -s -o /dev/null -L --max-redirs 5 -m 20 -w '%{http_code} em %{url_effective} (%{num_redirects} saltos)' "$u")"
          done
          echo "::notice::Cabeçalhos repassados ao site pelo servidor (https): $(curl -s -m 20 -I https://www.tgtmarketing.com.br/ | grep -iE '^(server|x-forwarded|strict-transport)' | tr -d '\r' | tr '\n' ' ')"
          echo "::notice::Como o mundo vê hoje (https, DNS público): $(curl -s -m 20 https://www.tgtmarketing.com.br/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1) | esta versão: $(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)"
          for t in NS A AAAA MX; do echo "::notice::tgtmarketing.com.br $t: $(dig +short $t tgtmarketing.com.br | tr '\n' ' ')"; done
          echo "::notice::www.tgtmarketing.com.br CNAME: $(dig +short CNAME www.tgtmarketing.com.br | tr '\n' ' ') | A: $(dig +short A www.tgtmarketing.com.br | tr '\n' ' ') | AAAA: $(dig +short AAAA www.tgtmarketing.com.br | tr '\n' ' ')"
